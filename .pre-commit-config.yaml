# Hook entries invoke `python` (not `python3`): with language: python,
# pre-commit runs hooks inside a managed virtualenv whose interpreter is
# guaranteed to be Python 3, and Windows virtualenvs ship `python.exe` only
# (no `python3.exe`). Using `python3` here breaks native Windows. Everywhere
# Python runs against the *system* interpreter (shell helpers, install.sh, CI,
# direct script execution) we use `python3` to avoid Python 2.
default_language_version:
  python: python3
repos:
  - repo: local
    hooks:
      # --- Hard checks (structural integrity — block on failure) ---

      - id: skill-frontmatter
        name: Skill Frontmatter
        entry: python pipeline/hooks/check_frontmatter.py
        language: python
        files: 'SKILL\.md$'
        exclude: '(eval-cases/|templates/|node_modules/|pipeline/)'
        types: [markdown]
        additional_dependencies: ['pyyaml']

      - id: skill-references
        name: Skill Reference Integrity
        entry: python pipeline/hooks/check_references.py
        language: python
        files: 'SKILL\.md$'
        exclude: '(eval-cases/|templates/|node_modules/|pipeline/)'
        types: [markdown]

      - id: skill-isolation
        name: Skill Isolation
        entry: python pipeline/hooks/check_isolation.py
        language: python
        files: 'SKILL\.md$'
        exclude: '(eval-cases/|templates/|node_modules/|pipeline/)'
        types: [markdown]

      - id: skill-context-load
        name: Suite Context Load
        entry: python pipeline/hooks/check_context_load.py
        language: python
        files: '(SKILL\.md|references/.*\.md|shared-references/.*\.md)$'
        exclude: '(eval-cases/|templates/|node_modules/|pipeline/)'
        types: [markdown]

      # --- Advisory checks (warn only — never block) ---

      - id: skill-token-budget
        name: Skill Token Budget (advisory)
        entry: python pipeline/hooks/check_token_budget.py
        language: python
        files: '(SKILL\.md|references/.*\.md|shared-references/.*\.md)$'
        exclude: '(eval-cases/|templates/|node_modules/|pipeline/)'
        types: [markdown]
        verbose: true

      - id: skill-prose-check
        name: Skill Prose Check (advisory)
        entry: python pipeline/hooks/check_prose.py
        language: python
        files: 'SKILL\.md$'
        exclude: '(eval-cases/|templates/|node_modules/|pipeline/)'
        types: [markdown]
        verbose: true

      # --- Commit message ---

      - id: skill-commit-msg
        name: Skill Commit Message
        entry: python pipeline/hooks/check_commit_msg.py
        language: python
        stages: [commit-msg]
        always_run: true
